[package]
name = "semctx-gates"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "semctx-gates"

[[bin]]
name = "semctx-gates-fixture"
path = "tests/support/fixture.rs"
test = false

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_Console"] }
