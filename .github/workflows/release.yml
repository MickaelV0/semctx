name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    if: github.repository == 'hoklims/semctx'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: npm install --global npm@12.0.1
      - run: bun install --frozen-lockfile
      - run: bun run quality
      - run: bun run test
      - run: bun run plugin:check
      - name: Verify release tag matches the package version
        shell: bash
        run: |
          bun -e "import p from './apps/cli/package.json';
          const tag = process.env.GITHUB_REF_NAME ?? '';
          if (tag !== 'v' + p.version) throw new Error('release tag ' + tag + ' != v' + p.version)"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Publish semctx to npm or prove the existing version is this commit
        working-directory: apps/cli
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          published_sha=""
          if published_sha="$(npm view "semctx@$version" gitHead 2>/dev/null)"; then
            published_sha="$(printf '%s' "$published_sha" | tr -d '\r\n')"
          fi
          if [[ -n "$published_sha" && "$published_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::semctx@$version already belongs to commit $published_sha, not $GITHUB_SHA"
            exit 1
          fi
          if [[ -z "$published_sha" ]]; then
            npm publish --access public
          fi
          for attempt in {1..12}; do
            confirmed_sha=""
            if confirmed_sha="$(npm view "semctx@$version" gitHead 2>/dev/null)"; then
              confirmed_sha="$(printf '%s' "$confirmed_sha" | tr -d '\r\n')"
              if [[ "$confirmed_sha" == "$GITHUB_SHA" ]]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::npm never exposed semctx@$version with gitHead $GITHUB_SHA"
          exit 1
      - name: Advance the stable plugin channel after npm is public
        run: git push origin "$GITHUB_SHA:refs/heads/stable"
      - name: Create the GitHub Release after npm is public
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1
          || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
