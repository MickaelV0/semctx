name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: python -m pip install --disable-pip-version-check --requirement requirements-quality.txt
      - run: bun install --frozen-lockfile
      - run: bun run quality
      - run: python -m compileall -q benchmarks/change-impact-eval/scripts
      - run: python benchmarks/change-impact-eval/scripts/smoke_test.py
